name: Deploy Casa de Aventura to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Prepare static Pages artifact
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR=""
          for candidate in ".output/public" "dist" "dist/client"; do
            if [ -f "$candidate/index.html" ]; then
              OUTPUT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$OUTPUT_DIR" ]; then
            echo "Nenhum diretório estático com index.html foi encontrado após o build."
            find . -maxdepth 3 -type f \( -name "index.html" -o -name "*.js" \) | head -100 || true
            exit 1
          fi
          echo "Publicando: $OUTPUT_DIR"
          if [ -f "CNAME" ]; then cp CNAME "$OUTPUT_DIR/CNAME"; fi
          touch "$OUTPUT_DIR/.nojekyll"
          cp "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/404.html"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.prepare.outputs.output_dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
